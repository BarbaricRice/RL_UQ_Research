<html>
    <head>
        <!--Load the AJAX API-->
        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
        <script type="text/javascript">
            // Load the Visualization API and the corechart package.
            google.charts.load('current', {'packages':['corechart'], 'language': 'en_AU'});

            // Set a callback to run when the Google Visualization API is loaded.
            google.charts.setOnLoadCallback(drawChart);

            // Set a callback to run when the window is reloaded or resized.
            window.onload = window.onresize = window.drawChart;

            // Callback that creates and populates a data table,
            // instantiates the candlestick graph, passes in the data and
            // draws it.
            function drawChart() {

                // Create the data table.
                var data = new google.visualization.arrayToDataTable([
					['Pathfinder_Model_NE_Exit.pth', 33.50, 14.80, 31.00, 3.50],
					['Pathfinder_Model_South Exit.pth', 28.70, 14.90, 25.90, 6.40],
					['Pathfinder_Model_West Exit.pth', 34.50, 15.90, 30.50, 7.80],
					['ALL', 34.50, 15.12, 29.22, 3.50],
                ], true);

                // Set chart options
                var options = {

                    'title': 'Travel Distances for All Occupants (m):',
                    'legend': 'none',
					hAxis : {title: 'Case'},
					vAxis : {title: 'Distance (m)'}
                };

                // Instantiate and draw the chart, passing in the options.
                var chart = new google.visualization.CandlestickChart(document.getElementById('chart_div'));
                chart.draw(data, options);
            }
        </script>
    </head>
    <body>
        <!--Div that will hold the pie chart-->
        <div id="chart_div"></div>
    </body>
</html>
